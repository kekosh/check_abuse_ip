name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini PR Reviewer
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          debug: false
          review_comment_lgtm: false
          openai_heavy_model: "gemini-2.5-flash" # 使用するモデル
          openai_light_model: "gemini-2.5-flash"
          openai_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/" # OpenAI互換エンドポイント経由でGeminiを呼ぶ
          language: "ja-JP"
          path_filters: |
            !*.lock
            !*.min.js
            !dist/**
          system_message: |
            あなたはシニアエンジニアです。以下の観点から日本語で簡潔にコードレビューを行ってください：
            - バグやロジックの誤り、境界値・エッジケースの考慮漏れ
            - セキュリティ脆弱性
            - パフォーマンス上の懸念点
