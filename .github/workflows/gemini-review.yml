name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini PR Reviewer
        uses: truongnh1992/gemini-ai-code-reviewer@v9.2.1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_model: "gemini-2.5-flash"
          language: "ja-JP"
          # 必要に応じて対象外ファイルを指定
          exclude_files: "*.lock, *.min.js, dist/*"
