name: Gemini Official Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get git diff
        id: git_diff
        run: |
          DIFF=$(git --no-pager diff origin/${{ github.base_ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Google Official Gemini Action
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-3.8-flash"
          gemini_debug: "true"
          prompt: |
            以下の Pull Request の差分（git diff）を確認し、
            シニアエンジニアの視点でコードレビューを行ってください。
            結果を日本語のマークダウン形式で出力してください。
            - バグやロジックの誤り、エッジケースの考慮漏れ
            - セキュリティ上の脆弱性
            - パフォーマンスや可読性の改善点
            - 良い実装に関する評価

            ### PR差分:
            ```diff
            ${{ steps.git_diff.outputs.diff }}
            ```

      - name: Post Review Comment
        if: steps.gemini.outputs.summary != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_SUMMARY: ${{ steps.gemini.outputs.summary }}
        run: |
          echo "$REVIEW_SUMMARY" | gh pr comment ${{ github.event.pull_request.number }} --body-file -
